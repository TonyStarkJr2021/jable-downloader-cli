name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify version and run tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(cat VERSION)" = "$RELEASE_TAG"
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m py_compile jable_downloader.py migrate_media_layout.py hls_proxy.py supjav_adblock.py jable_web/*.py
          python -m unittest discover -s tests -v
          bash -n install.sh update.sh uninstall.sh bin/n

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip \
            --prefix="jable-downloader-cli-${RELEASE_TAG}/" \
            --output="jable-downloader-cli-${RELEASE_TAG}.zip" HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES=""
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ -n "$NOTES" ]]; then
              gh release create "$RELEASE_TAG" \
                --title "Jable + MissAV + SupJav Downloader ${RELEASE_TAG}" \
                --notes-file "$NOTES"
            else
              gh release create "$RELEASE_TAG" \
                --title "Jable + MissAV + SupJav Downloader ${RELEASE_TAG}" \
                --generate-notes
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            "jable-downloader-cli-${RELEASE_TAG}.zip" --clobber
